<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pompiste : identifier le client</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#0B5D4B}a:hover{color:#07402F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F0; color: #13201A; font-family: Inter, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="background: #0B5D4B; color: #FFFFFF; padding: 18px 20px 16px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; opacity: 0.85">Ola Latrie · Pompe 3</span>
      <span style="font-size: 16px; font-weight: 700">Yao · service ouvert 06:00</span>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #E3F0EB; color: #0B5D4B; font-size: 12px; font-weight: 700">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.4a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/></svg>
      En ligne
    </span>
  </div>

  <div style="flex: 1; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.1">Qui est le client ?</h1>

    <button type="button" style="height: 120px; border: 0; border-radius: 18px; background: #0B5D4B; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: Inter, sans-serif">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F2A516" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="7" width="4" height="4"/><rect x="7" y="13" width="4" height="4"/><path d="M13 13h4v4"/></svg>
      <span style="font-size: 19px; font-weight: 700">Scanner le QR code</span>
    </button>

    <div style="display: flex; align-items: center; gap: 10px; color: #4A5A52; font-size: 13px">
      <span style="flex: 1; border-top: 1px solid #DCE1D9"></span>ou par numéro<span style="flex: 1; border-top: 1px solid #DCE1D9"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="tel" style="font-size: 14px; font-weight: 600">Numéro de téléphone</label>
      <div style="display: flex; gap: 8px">
        <span style="height: 60px; padding: 0 12px; border-radius: 14px; background: #FFFFFF; border: 2px solid #DCE1D9; display: flex; align-items: center; font-weight: 700; font-size: 17px">+225</span>
        <input id="tel" type="tel" value="07 08 45 12 12" style="flex: 1; min-width: 0; height: 60px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #0B5D4B; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 0.04em; color: #13201A">
      </div>
    </div>

    <button type="button" style="height: 56px; border: 0; border-radius: 14px; background: #13201A; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 700">Rechercher</button>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5A52">Mes derniers passages</span>
      <div style="background: #FFFFFF; border-radius: 14px; display: flex; flex-direction: column">
        <div style="display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #EEF0EB; font-size: 14px"><span><b>Awa K.</b> · Gasoil 10 000 F</span><span style="color: #4A5A52; font-variant-numeric: tabular-nums">08:42</span></div>
        <div style="display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #EEF0EB; font-size: 14px"><span><b>Moussa D.</b> · Super 25 000 F</span><span style="color: #4A5A52; font-variant-numeric: tabular-nums">08:37</span></div>
        <div style="display: flex; justify-content: space-between; padding: 12px 14px; font-size: 14px"><span><b>Fanta T.</b> · Gasoil 2 500 F</span><span style="color: #4A5A52; font-variant-numeric: tabular-nums">08:21</span></div>
      </div>
    </div>
  </div>

  <div style="padding: 0 20px 24px">
    <button type="button" style="width: 100%; height: 60px; border: 2px dashed #0B5D4B; border-radius: 14px; background: transparent; color: #0B5D4B; font-family: Inter, sans-serif; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nouveau client (30 s)
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
